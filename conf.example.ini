; Display Card Manager 引导配置
;
; 这个文件是**唯一**不放在数据库里的配置：程序要先读到它才能连上 MySQL，
; 而其余所有配置（图床连接、汇率来源、系统参数）都存在 MySQL 的 app_settings 表里。
;
; 用法：复制为 conf.ini 并填写真实连接信息。conf.ini 已在 .gitignore 中，不会被提交。
; 每一项都可以用环境变量覆盖（见方括号后的注释），方便打包后在不同机器上部署。

[mysql]
; DISPLAYCARD_MYSQL_HOST
host = 127.0.0.1
; DISPLAYCARD_MYSQL_PORT
port = 3306
; DISPLAYCARD_MYSQL_USER
user = root
; DISPLAYCARD_MYSQL_PASSWORD
password =
; DISPLAYCARD_MYSQL_DATABASE
; 库不存在时程序会自己 CREATE DATABASE（需要账号有建库权限）；
; 没有建库权限就先手动建好空库，程序只建表。
database = display_card
charset = utf8mb4
; 连接池大小。这是个人自用系统，并发很低，4 条足够。
pool_size = 4
; 单条连接的空闲回收秒数。MySQL 默认 wait_timeout 是 8 小时，
; 服务端先掐断而客户端不知情时，下一个请求会撞上 "MySQL server has gone away"。
; 比 wait_timeout 小一大截即可，这里取 1 小时。
pool_recycle = 3600

[server]
; DISPLAYCARD_HOST / DISPLAYCARD_PORT
host = 0.0.0.0
port = 9701
